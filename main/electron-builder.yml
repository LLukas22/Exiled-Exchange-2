publish:
  - "github"
productName: "Exiled Exchange 2"
appId: "exiled-exchange-2"
npmRebuild: false
files:
  - "package.json"
  - from: "dist"
    to: "."
    filter: ["main.js", "vision.js"]
  - from: "../renderer/dist"
    to: "."
extraResources:
  - from: "native/ee2-uinput.py"
    to: "native/ee2-uinput.py"
  - from: "dist/native/ee2-win-clipboard.exe.so"
    to: "native/ee2-win-clipboard.exe.so"
extraMetadata:
  main: "main.js"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
win:
  target:
    - "nsis"
    - "portable"
linux:
  target:
    - "AppImage"
mac:
  target:
    - target: "dmg"
      arch:
        - "universal"
  identity: null
  x64ArchFiles: "*"
appImage:
  executableArgs:
    - "--sandbox"
