name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
      - "wayland-rust-helper"
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - README.md

jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate release tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./main/package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
      - run: npm ci
        working-directory: ./renderer
      - run: npm run make-index-files
        working-directory: ./renderer
      - run: npm run lint
        working-directory: ./renderer
      - run: npm run build
        working-directory: ./renderer
      - uses: actions/upload-artifact@v7
        with:
          name: renderer-dist
          path: ./renderer/dist
          retention-days: 1

  prepare-release:
    needs: renderer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes --verify-tag
          fi
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true

  package:
    needs: [renderer, prepare-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install MinGW linker
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - uses: actions/download-artifact@v8
        with:
          name: renderer-dist
          path: ./renderer/dist
      - name: Install main dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 10))"
            fi
          done
          exit 1
        working-directory: ./main
      - name: Configure build repository
        run: npm pkg set repository.url=https://github.com/${{ github.repository }}.git
        working-directory: ./main
      - run: npm run build
        working-directory: ./main
      - name: Verify Windows helper
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          set -euo pipefail
          helper=./main/dist/native/ee2-win-clipboard.exe
          test -s "$helper"
          file "$helper" | tee /dev/stderr | grep -q 'PE32+ executable'
      - name: Package application
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run package "--" --publish never
        working-directory: ./main
      - name: Package and upload release assets
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: npm run package "--" --publish always
        working-directory: ./main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify AppImage contents
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(./main/dist/*.AppImage)
          test "${#appimages[@]}" -eq 1
          "${appimages[0]}" --appimage-extract >/dev/null
          helper=./squashfs-root/resources/native/ee2-win-clipboard.exe
          test -s "$helper"
          file "$helper" | tee /dev/stderr | grep -q 'PE32+ executable'
          cmp ./main/dist/native/ee2-win-clipboard.exe "$helper"
      - name: Upload Linux AppImage
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        uses: actions/upload-artifact@v7
        with:
          name: exiled-exchange-2-linux-appimage
          path: |
            ./main/dist/*.AppImage
            ./main/dist/latest-linux.yml
          if-no-files-found: error
      - name: Hash
        if: ${{ startsWith(matrix.os, 'windows') }}
        run: type .\main\dist\latest.yml
      - name: Hash
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: cat ./main/dist/latest-linux.yml
      - name: Hash
        if: ${{ startsWith(matrix.os, 'macos') }}
        run: cat ./main/dist/latest-mac.yml

  publish-release:
    needs: package
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          grep -qE '\.AppImage$' <<<"$assets"
          grep -qE '\.dmg$' <<<"$assets"
          grep -qE '\.exe$' <<<"$assets"
          grep -qx 'latest-linux.yml' <<<"$assets"
          grep -qx 'latest-mac.yml' <<<"$assets"
          grep -qx 'latest.yml' <<<"$assets"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
